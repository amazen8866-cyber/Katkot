<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🐥 أشطر كتكوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#BFE9FF;--sun:#FFF3B0;--yel:#FFD93B;--ora:#FF9F1C;--blue:#3FA7E0;--ink:#2B3A55;--ok:#3CC47C;--bad:#F2605C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sun) 100%) fixed;font-size:20px;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:12px 14px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}
.brand{font-weight:800;font-size:20px}
.snd{width:52px;height:52px;border-radius:50%;border:0;background:#fff;font-size:26px;box-shadow:0 4px 0 #0002;cursor:pointer}
.card{background:#fff;border-radius:32px;padding:20px 18px;box-shadow:0 8px 0 #0001;text-align:center;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
h1{margin:6px 0 0;font-size:44px;font-weight:800;line-height:1.1}
h2{margin:0;font-size:24px}
.sub{color:var(--blue);font-weight:700;font-size:22px;margin:4px 0 12px}
.fl{animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(-3deg)}}
.hero svg,.mini svg{width:150px;height:150px}
label{display:block;font-weight:700;margin:14px 0 6px}
input{width:100%;font:inherit;font-size:26px;text-align:center;padding:12px;border:4px solid var(--yel);border-radius:22px;outline:none;color:var(--ink)}
input:focus{border-color:var(--blue)}
.btn{display:block;width:100%;font:inherit;font-weight:800;font-size:26px;padding:16px;border:0;border-radius:26px;color:#fff;background:var(--ora);box-shadow:0 6px 0 #c97800;cursor:pointer;margin-top:14px;transition:transform .1s}
.btn:active{transform:translateY(4px) scale(1.04);box-shadow:0 2px 0 #c97800}
.btn.b{background:var(--blue);box-shadow:0 6px 0 #2a82b5}
.btn.g{background:var(--ok);box-shadow:0 6px 0 #279a5c}
.btn.sm{font-size:21px;padding:12px}
.err{color:var(--bad);font-weight:700;min-height:28px}
.slogan{margin-top:16px;font-weight:700;color:var(--blue)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.pill{background:#fff;border-radius:999px;padding:4px 16px;font-weight:800;box-shadow:0 3px 0 #0001}
.prog{height:22px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px #0002;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ora),var(--yel));border-radius:999px;transition:width .5s}
.art{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.scene{font-size:64px;background:var(--sun);border-radius:28px;padding:6px 18px;line-height:1.2}
.mini svg{width:84px;height:84px}
.q{font-size:25px;font-weight:800;margin:6px 0 14px;line-height:1.4}
.opts{display:grid;gap:12px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-weight:700;font-size:23px;padding:16px 12px;border-radius:24px;border:4px solid var(--sky);background:#F4FBFF;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #0001;transition:transform .1s;min-height:64px}
.opt:active{transform:scale(1.04)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:bnc .6s}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:shk .5s}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
@keyframes bnc{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.96)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:shk .5s}
.fb{margin-top:14px;padding:12px;border-radius:22px;font-weight:700}
.fb.ok{background:#E3F9EC}.fb.bad{background:#FFEDEC}
.fb big{display:block;font-size:26px;font-weight:800}
.res{font-size:30px;font-weight:800;margin:6px 0}
.big{font-size:90px;line-height:1}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
#certimg{width:100%;border-radius:18px;border:4px solid var(--yel);margin-top:10px}
.hide{display:none!important}.rd{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:6px 18px;margin:0 0 8px;cursor:pointer;box-shadow:0 4px 0 #2a82b5}.rd:active{transform:scale(1.05)}
.note{font-size:17px;color:#5b6b85}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:600px){h1{font-size:56px}.q{font-size:30px}.opt{font-size:26px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="app">
 <div class="top"><div class="brand">🐥 أشطر كتكوت</div><button class="snd" id="snd" aria-label="الصوت">🔊</button></div>
 <div id="view"></div>
</div>
<script>
(function(){
var QS=[
{q:"مين في دول ممكن يستخدم الذكاء الاصطناعي؟",o:["الروبوت 🤖","القلم ✏️","الكرسي 🪑","الكرة ⚽"],c:0,s:"🤖"},
{q:"لو طلبنا من جهاز ذكي إنه يحكي لنا قصة، إيه اللي ممكن يعمله؟",o:["يحكي قصة 📖","ينام 😴","يأكل 🍎","يجري 🏃"],c:0,s:"🤖📖🧒"},
{q:"أي صورة من دول ممكن تكون مرتبطة بالذكاء الاصطناعي؟",o:["🤖","🍌","🧸","🧦"],c:0,s:"🤖"},
{q:"الذكاء الاصطناعي ممكن يساعدنا في إيه؟",o:["التعلم 📚","كسر الألعاب","إخفاء الكتب","إتلاف الأجهزة"],c:0,s:"🧒📚🤖"},
{q:"لو جهاز ذكي قدر يتعرف على صوتك، ده مثال على استخدام…",o:["الذكاء الاصطناعي 🤖","الألوان 🎨","الورق 📄","المقص ✂️"],c:0,s:"🧒🎤📱"},
{q:"🤖 الذكاء الاصطناعي ممكن يساعد الأطفال في التعلم.",tf:1,c:0,s:"🤖"},
{q:"🧠 الذكاء الاصطناعي هو إن الكمبيوتر يفكر ويتعلم بطريقة تشبه بعض قدرات الإنسان.",tf:1,c:0,s:"🧠"},
{q:"🍎 كل جهاز إلكتروني يعتبر ذكاءً اصطناعيًا.",tf:1,c:1,s:"🍎"},
{q:"🤖 الروبوتات وبعض التطبيقات ممكن تستخدم الذكاء الاصطناعي.",tf:1,c:0,s:"🤖"},
{q:"🧸 الذكاء الاصطناعي هو لعبة للأطفال فقط.",tf:1,c:1,s:"🧸"}];
var TF=["✅ صح","❌ غلط"];
var $=function(s){return document.querySelector(s)},V=$('#view');
var st={name:'',i:0,score:0,done:false},muted=false;
try{var sv=JSON.parse(localStorage.getItem('ak')||'null');if(sv&&sv.name)st=sv;muted=localStorage.getItem('akm')==='1'}catch(e){}
function save(){try{localStorage.setItem('ak',JSON.stringify(st))}catch(e){}}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

/* characters */
function chick(m){var mo=m==='happy'?'M48 68Q60 82 72 68':'M52 69Q60 74 68 69';
return '<svg viewBox="0 0 120 120"><path d="M60 14q-6 8 0 14M52 16q-4 6 2 11M68 16q4 6-2 11" stroke="#FF9F1C" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="60" cy="76" rx="40" ry="34" fill="#FFD93B"/><circle cx="60" cy="50" r="32" fill="#FFD93B"/><ellipse cx="22" cy="78" rx="10" ry="18" fill="#FFC21A" transform="rotate(20 22 78)"/><ellipse cx="98" cy="78" rx="10" ry="18" fill="#FFC21A" transform="rotate(-20 98 78)"/><circle cx="46" cy="46" r="6" fill="#2B3A55"/><circle cx="74" cy="46" r="6" fill="#2B3A55"/><circle cx="48" cy="44" r="2" fill="#fff"/><circle cx="76" cy="44" r="2" fill="#fff"/><circle cx="36" cy="58" r="6" fill="#FFA8A8" opacity=".7"/><circle cx="84" cy="58" r="6" fill="#FFA8A8" opacity=".7"/><path d="M52 55h16l-8 10z" fill="#FF9F1C"/><path d="'+mo+'" stroke="#2B3A55" stroke-width="2.5" fill="none" stroke-linecap="round" transform="translate(0 -3)"/><path d="M48 108v8M42 116h12M72 108v8M66 116h12" stroke="#FF9F1C" stroke-width="4" stroke-linecap="round"/></svg>'}
function robot(){return '<svg viewBox="0 0 120 120"><line x1="60" y1="8" x2="60" y2="22" stroke="#2B3A55" stroke-width="4"/><circle cx="60" cy="8" r="6" fill="#FF6B6B"/><rect x="26" y="22" width="68" height="52" rx="18" fill="#3FA7E0"/><rect x="34" y="30" width="52" height="36" rx="12" fill="#fff"/><circle cx="48" cy="46" r="7" fill="#2B3A55"/><circle cx="72" cy="46" r="7" fill="#2B3A55"/><path d="M50 58q10 8 20 0" stroke="#2B3A55" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="34" y="78" width="52" height="30" rx="12" fill="#fff" stroke="#3FA7E0" stroke-width="5"/><circle cx="60" cy="93" r="6" fill="#FFD93B"/><rect x="14" y="40" width="10" height="22" rx="5" fill="#3FA7E0"/><rect x="96" y="40" width="10" height="22" rx="5" fill="#3FA7E0"/><rect x="40" y="108" width="12" height="8" rx="4" fill="#2B3A55"/><rect x="68" y="108" width="12" height="8" rx="4" fill="#2B3A55"/></svg>'}

/* sound (Web Audio, no external files) */
var ac=null;
function unlock(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f,t,d,ty,v,f2){if(muted||!ac)return;var o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.type=ty||'triangle';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(v||.18,n+.02);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.02)}
function sGood(){[0,.13,.26,.39].forEach(function(t,i){tone(i%2?900:700,t,.1,'triangle',.2,i%2?700:900)});tone(1200,.55,.25,'sine',.15)}
function sBad(){tone(330,0,.28,'sine',.16,200)}
function sWin(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,i*.14,.22,'triangle',.18)});tone(1568,1,.5,'sine',.15)}
function sClick(){tone(600,0,.06,'sine',.08)}
/* speech (Web Speech API) */
var vo=null,SS='speechSynthesis' in window,ORD=['الأول','الثاني','الثالث','الرابع'];
function pickV(){try{var v=speechSynthesis.getVoices();vo=v.filter(function(x){return /^ar-EG/i.test(x.lang)})[0]||v.filter(function(x){return /^ar/i.test(x.lang)})[0]||null}catch(e){}}
if(SS){pickV();speechSynthesis.onvoiceschanged=pickV}
function say(t){if(muted||!SS)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\u2B50]/gu,' '));u.lang=vo?vo.lang:'ar-SA';if(vo)u.voice=vo;u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function readQ(q){return q.q+(q.tf?' . صح أم غلط؟':' . '+q.o.map(function(t,i){return 'الاختيار '+ORD[i]+': '+t}).join(' . '))}
document.addEventListener('pointerdown',unlock,{passive:true});
var sb=$('#snd');function paintS(){sb.textContent=muted?'🔇':'🔊'}paintS();
sb.onclick=function(){unlock();muted=!muted;try{localStorage.setItem('akm',muted?'1':'0')}catch(e){}paintS();if(muted){try{speechSynthesis.cancel()}catch(e){}}else sClick()};

/* confetti */
var cv=$('#cv'),cx=cv.getContext('2d'),ps=[],raf=0;
function confetti(){cv.width=innerWidth;cv.height=innerHeight;var cl=['#FFD93B','#FF9F1C','#3FA7E0','#3CC47C','#F2605C','#B57BFF'];ps=[];for(var i=0;i<110;i++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:8+Math.random()*8,h:6+Math.random()*8,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cl[i%6]});cancelAnimationFrame(raf);(function f(){cx.clearRect(0,0,cv.width,cv.height);var a=0;ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<cv.height+20){a=1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}});if(a)raf=requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height)})()}

/* screens */
function home(){
V.innerHTML='<div class="card"><div class="hero fl">'+chick('happy')+'</div><h1>أشطر كتكوت</h1><div class="sub">🤖 اختبار الذكاء الاصطناعي للأطفال</div><p>جاهز يا بطل؟ خلينا نشوف هتجيب كام! 🚀</p><label for="nm">اكتب اسمك الأول</label><input id="nm" maxlength="14" placeholder="مثال: مازن" autocomplete="off" value="'+esc(st.name)+'"><div class="err" id="er"></div><button class="btn" id="go">🚀 ابدأ الاختبار</button><div class="slogan">اتعلم والعب وخليك أشطر كتكوت! 🤖🐥</div></div>';
var nm=$('#nm');
$('#go').onclick=function(){var n=nm.value.trim();if(!n){$('#er').textContent='اكتب اسمك الأول يا بطل 😊';nm.classList.remove('shake');void nm.offsetWidth;nm.classList.add('shake');nm.focus();return}
sClick();st={name:n,i:0,score:0,done:false};save();quiz(true)};
nm.onkeydown=function(e){if(e.key==='Enter')$('#go').click()}}

var hello=["يلا يا N! جاهز؟ 🐥","ركز يا N 👀","إنت قدها يا N 💪","كمل يا N! 🚀","يلا يا N 🐥","نص الطريق يا N! ⭐","قرّبنا يا N 😍","استمر يا N 🌈","آخر سؤالين يا N! 🏃","السؤال الأخير يا N! 🏁"];
function quiz(first){
var q=QS[st.i],ans=false,pct=st.i*10;
var bars='';for(var k=0;k<10;k++)bars+=k<st.i?'█':'░';
V.innerHTML='<div class="bar"><div class="pill">السؤال '+(st.i+1)+' من 10</div><div class="pill" id="sc">⭐ '+st.score+'</div></div><div class="prog" aria-label="'+bars+'"><i style="width:'+pct+'%"></i></div>'+
'<div class="card"><div class="art"><div class="mini fl" id="ck">'+chick('happy')+'</div><div class="scene">'+q.s+'</div><div class="mini">'+robot()+'</div></div><div class="pill" style="display:inline-block;margin-bottom:8px">'+esc(hello[st.i].replace('N',st.name))+'</div><div><button class="rd" id="rd">🔊 اسمع السؤال</button></div><div class="q">'+q.q+'</div><div class="opts'+(q.tf?' tf':'')+'" id="op"></div><div id="fb"></div></div>';
requestAnimationFrame(function(){$('.prog i').style.width=(st.i*10+0)+'%'});
var op=$('#op'),opts=q.tf?TF:q.o,btns=[];
opts.forEach(function(t,ix){var b=document.createElement('button');b.className='opt';b.textContent=(q.tf?'':'أبجد'[ix]+') ')+t;op.appendChild(b);btns.push(b);
b.onclick=function(){if(ans)return;ans=true;unlock();btns.forEach(function(x){x.disabled=true});
var ok=ix===q.c,fb=$('#fb'),n=esc(st.name);say(ok?'أشطر كتكوت يا '+st.name:'قريبة يا '+st.name+'. الإجابة الصحيحة هي: '+opts[q.c]);
if(ok){st.score++;b.classList.add('ok');b.textContent+=' ✅';sGood();$('#ck').innerHTML=chick('happy');
fb.innerHTML='<div class="fb ok"><big>🎉 أشطر كتكوت يا '+n+'!</big></div>'}
else{b.classList.add('bad');b.textContent+=' ❌';btns[q.c].classList.add('ok');btns[q.c].textContent+=' ✅';sBad();$('#ck').innerHTML=chick('ok');
fb.innerHTML='<div class="fb bad"><big>قريبة يا '+n+' 😄</big>الإجابة الصحيحة هي:<br><b>'+esc(opts[q.c])+'</b></div>'}
btns.forEach(function(x){if(!x.classList.contains('ok')&&!x.classList.contains('bad'))x.classList.add('dim')});
$('#sc').textContent='⭐ '+st.score;$('.prog i').style.width=(st.i+1)*10+'%';
var nx=document.createElement('button');nx.className='btn g';nx.textContent=st.i===9?'شوف نتيجتك 🏆':'السؤال التالي ➜';fb.appendChild(nx);
st.i++;if(st.i===10)st.done=true;save();
nx.onclick=function(){sClick();if(st.done)end();else quiz()};nx.scrollIntoView({behavior:'smooth',block:'center'})}});
$('#rd').onclick=function(){unlock();say(readQ(q))};say(readQ(q));if(first)window.scrollTo(0,0)}

function msg(){var s=st.score,n=esc(st.name);
if(s===10)return{e:'🏆🐥',t:'ياااااه يا '+n+'!',l:['أنت أشطر كتكوت!','جبت 10 من 10 ⭐','إنت بطل الذكاء الاصطناعي! 🤖🧠']};
if(s>=8)return{e:'🎉🐥',t:'برافو يا '+n+'! 🏆',l:['نتيجتك ممتازة جدًا!','جبت '+s+' من 10']};
if(s>=5)return{e:'👏🐥',t:'شاطر يا '+n+'!',l:['ممكن تعمل نتيجة أحسن المرة الجاية!','جبت '+s+' من 10']};
return{e:'💪🐥',t:'ولا يهمك يا '+n+'!',l:['جرب تاني وهتبقى أشطر كتكوت!','جبت '+s+' من 10']}}
function end(){var m=msg();
V.innerHTML='<div class="card"><div class="big fl">'+m.e+'</div><div class="res">'+m.t+'</div>'+m.l.map(function(x){return'<p style="margin:4px 0;font-weight:700">'+x+'</p>'}).join('')+'<div class="pill" style="display:inline-block;margin:8px 0">⭐ '+st.score+' / 10</div><p>مبروك يا '+esc(st.name)+'! 🏆</p><button class="btn b" id="ce">📜 احصل على شهادتك</button><button class="btn" id="sh">📤 شارك نتيجتك</button><button class="btn g" id="rp">🔄 العب تاني</button><div class="note" id="nt"></div></div>';
sWin();confetti();window.scrollTo(0,0);say(m.t.replace(/&\w+;|<[^>]*>/g,'')+'. '+m.l[0]);
$('#ce').onclick=function(){sClick();cert()};
$('#sh').onclick=share;
$('#rp').onclick=function(){sClick();st={name:st.name,i:0,score:0,done:false};save();quiz(true)}}

function share(){var t='🐥 أنا '+st.name+' جبت '+st.score+'/10 في اختبار أشطر كتكوت للذكاء الاصطناعي! 🤖🧠';
if(navigator.share){navigator.share({text:t}).catch(function(){})}
else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){$('#nt').textContent='تم نسخ النتيجة ✅ الصقها وابعتها لأصحابك!'}).catch(function(){$('#nt').textContent=t})}
else $('#nt').textContent=t}

function cert(){
var c=document.createElement('canvas');c.width=1200;c.height=850;var x=c.getContext('2d');
var F="'Baloo Bhaijaan 2','Segoe UI',Tahoma,Arial,sans-serif";
var g=x.createLinearGradient(0,0,0,850);g.addColorStop(0,'#BFE9FF');g.addColorStop(1,'#FFF3B0');x.fillStyle=g;x.fillRect(0,0,1200,850);
x.fillStyle='#fff';rr(x,50,50,1100,750,50);x.fill();x.lineWidth=14;x.strokeStyle='#FFD93B';rr(x,50,50,1100,750,50);x.stroke();
x.setLineDash([4,22]);x.lineCap='round';x.lineWidth=8;x.strokeStyle='#3FA7E0';rr(x,80,80,1040,690,38);x.stroke();x.setLineDash([]);
x.direction='rtl';x.textAlign='center';x.textBaseline='middle';
x.font='110px serif';x.fillText('🐥',600,150);x.font='60px serif';x.fillText('🤖',210,150);x.fillText('⭐',990,150);
